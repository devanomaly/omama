name: verify

# The repo's own receipt. "A rule without enforcement is a wish" — verify_all.py
# is the whole proof surface, so it runs on every push and PR, on the platform
# this toolkit is NOT developed on.
#
# Tri-state is preserved deliberately: verify_all.py exits 0 (all VERIFIED),
# 1 (something FAILED), or 2 (something was NOT-RUN). A NOT-RUN is a hole, not
# a pass — so exit 2 fails this job rather than being swallowed.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: fixtures (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11"]
        include:
          # Oldest interpreter the pieces claim to support.
          - os: ubuntu-latest
            python: "3.8"

    steps:
      - uses: actions/checkout@v4
        with:
          # Ancestry mode reads origin/master..<head> and other remote
          # branches' full history -- a shallow (default depth-1) checkout
          # would hide exactly what it needs to read. Push/dispatch don't
          # need it, so leave those at the default.
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}

      # fetch-depth: 0 unshallows the ref actually being built (the
      # synthetic refs/pull/N/merge on pull_request events); it does not by
      # itself guarantee every other branch is present as a remote-tracking
      # ref, which the ancestry check also needs to find a sibling branch.
      - name: Fetch full history and all remote branches (ancestry check)
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: PRs must branch off master
        if: github.event_name == 'pull_request'
        run: python check_pr_base.py "${{ github.event.pull_request.base.ref }}"

      - name: PR branch must not be forked from an unmerged sibling
        if: github.event_name == 'pull_request'
        # Deliberately the PR head SHA/ref, not HEAD: on pull_request events
        # HEAD is the synthetic refs/pull/N/merge, which is not the branch
        # whose ancestry we're checking.
        run: python check_pr_base.py --ancestry "${{ github.event.pull_request.head.sha }}" "${{ github.event.pull_request.head.ref }}"

      # protect-tests' guard is a Node script; without node its runner
      # reports NOT-RUN, which this job treats as a failure.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install PyYAML (work-order, receipt-gate)
        run: python -m pip install --disable-pip-version-check pyyaml

      # receipt-gate hashes a real tree and runs git; give it an identity so
      # fixture commits don't abort on a missing user.email.
      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "omama ci"
          git config --global init.defaultBranch main

      - name: Run every fixture
        shell: bash
        run: |
          set +e
          python verify_all.py
          rc=$?
          set -e
          echo "verify_all exit=$rc"
          case "$rc" in
            0) echo "::notice::all fixtures VERIFIED" ;;
            2) echo "::error::something was NOT-RUN — a coverage hole is not a pass"; exit 1 ;;
            *) echo "::error::a fixture FAILED (exit $rc)"; exit "$rc" ;;
          esac

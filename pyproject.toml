[build-system]
requires = ["setuptools>=68,<76"]
build-backend = "build_backend.backend"
backend-path = ["."]

[project]
name = "omama"
version = "0.1.0"
description = "Per-repository delivery of the Omama enforcement bundle"
readme = "cli/README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
dependencies = ["PyYAML>=6.0.2,<7"]

[project.scripts]
omama = "omama_cli.command:main"

[tool.setuptools]
package-dir = {"" = "cli"}
packages = ["omama_cli"]
include-package-data = true

[tool.setuptools.package-data]
omama_cli = ["_payload/**/*"]
